<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AnCLI</title>
<style>
/* ============================ 设计变量 ============================ */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f2f3f6;
  --surface-3: #e9ebef;
  --border: #e4e6eb;
  --border-strong: #d3d7de;
  --text: #14171c;
  --muted: #666e7a;
  --faint: #98a0ab;
  --accent: #b45309;
  --accent-ink: #ffffff;
  --accent-soft: #fdf1e3;
  --accent-line: #f0d3ae;
  --ok: #15803d;
  --ok-soft: #e9f6ed;
  --danger: #b91c1c;
  --danger-soft: #fdecec;
  --info: #6d28d9;
  --info-soft: #f2ecfd;
  --warn: #a16207;
  --console-bg: #fbfbfc;
  --console-text: #2b3138;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow: 0 12px 28px -18px rgba(16, 24, 40, .35);
  --r-xs: 8px; --r-sm: 10px; --r: 14px; --r-lg: 18px; --r-pill: 999px;
  --gap: 12px;
}
:root[data-theme="dark"] {
  --bg: #0e1013;
  --surface: #16191e;
  --surface-2: #1c2027;
  --surface-3: #232830;
  --border: #262b33;
  --border-strong: #333a45;
  --text: #e8eaee;
  --muted: #9aa2ae;
  --faint: #6c7481;
  --accent: #f0a45e;
  --accent-ink: #241704;
  --accent-soft: #2a2015;
  --accent-line: #4a3a24;
  --ok: #4fbf7a;
  --ok-soft: #14251b;
  --danger: #f2796f;
  --danger-soft: #2a1918;
  --info: #b193fb;
  --info-soft: #1e1a2c;
  --warn: #e0aa4e;
  --console-bg: #101317;
  --console-text: #cfd5dd;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 14px 30px -20px rgba(0, 0, 0, .8);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
::selection { background: var(--accent-soft); }

/* ============================ 顶栏 ============================ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
body.ime-open .topbar { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mark {
  width: 27px; height: 27px; flex: none; border-radius: 9px;
  display: grid; place-items: center; color: var(--accent-ink);
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000 12%));
  box-shadow: var(--shadow-sm);
}
.mark svg { width: 15px; height: 15px; }
.brand b { font-size: 15px; font-weight: 650; letter-spacing: .01em; }
.brand small { display: block; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; line-height: 1.2; }

.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--border); }
.seg button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: 500 11.5px/1 inherit; padding: 6px 10px; border-radius: var(--r-pill); transition: .16s;
}
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ============================ 布局 ============================ */
.wrap {
  max-width: 720px; margin: 0 auto;
  padding: 14px 16px calc(28px + env(safe-area-inset-bottom));
  display: grid; gap: var(--gap);
}
/* Grid/flex children must be allowed to shrink, otherwise a long unbreakable
   token (a log line, a base URL) widens the page and the layout scrolls sideways. */
.wrap > *, .app-main, .console, .list, .dlg-body { min-width: 0; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}

/* 状态条 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 12px 4px; }
.stat { padding: 2px 12px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat .k { color: var(--faint); font-size: 11px; letter-spacing: .02em; }
.stat .v { font-size: 14px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.ok { color: var(--ok); }
.stat .v.bad { color: var(--danger); }

/* 操作行 */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 500 13px/1 inherit; color: var(--text); cursor: pointer;
  padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--border);
  background: var(--surface); transition: background .16s, border-color .16s, color .16s, opacity .16s;
}
.btn svg { width: 15px; height: 15px; flex: none; }
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active:not(:disabled) { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000 12%); border-color: transparent; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.quiet.danger { color: var(--muted); }
.btn.quiet.danger:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn.xs { padding: 6px 10px; font-size: 12px; border-radius: var(--r-sm); }
.icon-btn {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-xs);
  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: .16s;
}
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }

/* 区块标题 */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px -2px; }
.sec-head h2 { font-size: 13px; font-weight: 650; letter-spacing: .02em; }
.meta { color: var(--faint); font-size: 11.5px; }

/* ============================ 工具列表 ============================ */
.list { display: grid; gap: 10px; }
.app {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 11px;
  padding: 13px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  transition: border-color .16s, box-shadow .16s;
}
.app[data-state="update"] { border-color: var(--accent-line); box-shadow: var(--shadow); }
.app[data-state="update"]::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
.mono {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  font: 650 14px/1 inherit; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--border);
}
.app[data-state="installed"] .mono { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.app[data-state="update"] .mono { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.app[data-state="broken"] .mono { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.app[data-state="native"] .mono { color: var(--info); background: var(--info-soft); border-color: transparent; }

.app-main { min-width: 0; }
.app-title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.app-title .name { font-size: 14.5px; font-weight: 620; letter-spacing: .01em; }
.desc { color: var(--muted); font-size: 12px; margin-top: 3px; }
.detail { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.detail b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.app-actions { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 2; margin-top: 10px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  font: 500 11px/1 inherit; padding: 4px 7px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Long value lists (configured keys, upstream errors) wrap instead of pushing the
   card wider than the viewport. */
.chip.wrap { white-space: normal; overflow-wrap: anywhere; text-align: left; line-height: 1.45; }
.chip.plain { background: transparent; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.update { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.chip.info { color: var(--info); background: var(--info-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--accent-soft); border-color: transparent; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }

.empty { text-align: center; color: var(--faint); font-size: 12.5px; padding: 26px 14px; }
.skeleton { height: 62px; border-radius: var(--r-lg); border: 1px solid var(--border);
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
  background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* ============================ 输出控制台 ============================ */
.console { overflow: hidden; }
.console-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px 9px 13px; border-bottom: 1px solid var(--border); background: var(--surface);
}
.console-head b { font-size: 12.5px; font-weight: 620; }
.spacer { flex: 1; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid var(--accent-line); border-top-color: var(--accent);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.log {
  max-height: 260px; overflow: auto; overscroll-behavior: contain;
  padding: 10px 13px; background: var(--console-bg); color: var(--console-text);
  font: 11.5px/1.62 ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2;
}
.log div { min-height: 1.62em; }
.log .l-cmd { color: var(--accent); }
.log .l-ok { color: var(--ok); }
.log .l-err { color: var(--danger); }
.log .l-dim { color: var(--faint); }
.log:empty::after { content: "等待操作…"; color: var(--faint); }

/* ============================ 配置弹窗 ============================ */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center;
  padding: 0; background: rgba(12, 14, 18, .42);
  opacity: 0; visibility: hidden; transition: opacity .18s, visibility .18s;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.overlay.show { opacity: 1; visibility: visible; }
.dialog {
  width: min(560px, 100%); max-height: min(88vh, 760px); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-bottom: 0;
  border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow);
  transform: translateY(14px); transition: transform .2s ease;
}
.overlay.show .dialog { transform: none; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 12px 12px 16px; border-bottom: 1px solid var(--border); }
.dlg-head h3 { font-size: 14.5px; font-weight: 620; }
.dlg-body { padding: 14px 16px 6px; overflow: auto; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border); background: var(--surface); }
.dlg-foot .btn { min-width: 88px; }
.note { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.note a { color: var(--accent); }
.note b { color: var(--text); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips:empty { display: none; }
.chips button {
  flex: none; font: 500 12px/1 inherit; color: var(--muted); cursor: pointer;
  padding: 7px 11px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface-2);
  transition: .16s;
}
.chips button:hover { border-color: var(--border-strong); color: var(--text); }
.chips button.sel { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.fields { display: grid; gap: 13px; padding-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.field label .tag { font-weight: 500; font-size: 11px; color: var(--faint); margin-left: 4px; }
.field input, .field select {
  width: 100%; font: 13px/1.4 inherit; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; transition: .16s;
  -webkit-appearance: none; appearance: none;
}
.field select { background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.field input:focus, .field select:focus { outline: 0; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { color: var(--faint); font-size: 11px; margin-top: 5px; line-height: 1.5; }
.adv { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 12px; }
.adv summary {
  cursor: pointer; list-style: none; color: var(--muted); font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
}
.adv summary::-webkit-details-marker { display: none; }
.adv summary::before { content: "›"; display: inline-block; transition: transform .16s; font-size: 14px; line-height: 1; }
.adv[open] summary::before { transform: rotate(90deg); }
.adv .field + .field { margin-top: 13px; }

/* ============================ 浮动提示 ============================ */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; transition: .2s;
  max-width: min(90vw, 460px); padding: 10px 14px; border-radius: var(--r-pill);
  background: var(--text); color: var(--surface); font-size: 12.5px; box-shadow: var(--shadow);
  pointer-events: none; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }

.foot { text-align: center; color: var(--faint); font-size: 11px; padding: 4px 0 2px; }

@media (min-width: 620px) {
  .app { grid-template-columns: 34px minmax(0, 1fr) auto; align-items: start; }
  .app-actions { grid-column: auto; margin-top: 1px; }
}
@media (max-width: 380px) {
  .stats { grid-template-columns: repeat(2, 1fr); row-gap: 10px; }
  .stat:nth-child(3) { border-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7l4 5-4 5M12.5 17H19"/>
      </svg>
    </span>
    <span>
      <b>AnCLI</b>
      <small id="stVer">…</small>
    </span>
  </div>
  <div class="seg" id="themeSwitch" role="group" aria-label="主题">
    <button data-theme="auto">自动</button>
    <button data-theme="light">浅色</button>
    <button data-theme="dark">深色</button>
  </div>
</header>

<main class="wrap">
  <section class="card stats" aria-label="环境状态">
    <div class="stat"><div class="k">Rootfs</div><div class="v" id="stRootfs">—</div></div>
    <div class="stat"><div class="k">Proot</div><div class="v" id="stProot">—</div></div>
    <div class="stat"><div class="k">已安装</div><div class="v" id="stCount">—</div></div>
    <div class="stat"><div class="k">可更新</div><div class="v" id="stUpdates">—</div></div>
  </section>

  <section class="actions">
    <button class="btn primary" id="btnCheck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      检查更新
    </button>
    <button class="btn" id="btnRefresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      刷新
    </button>
    <button class="btn quiet danger" id="btnRepair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 21H3l1.3-9.7a4 4 0 0 0 5-5z"/></svg>
      修复环境
    </button>
  </section>

  <div class="sec-head">
    <h2>工具</h2>
    <span class="meta" id="checkInfo">尚未检查</span>
  </div>
  <div class="list" id="apps">
    <div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <section class="card console" aria-label="输出">
    <div class="console-head">
      <span class="spin" id="busySpin" hidden></span>
      <b>输出</b>
      <span class="meta" id="logCount">0 行</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btnLogCopy" title="复制全部" aria-label="复制全部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      </button>
      <button class="icon-btn" id="btnLogClear" title="清空" aria-label="清空输出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      </button>
      <button class="icon-btn" id="btnLogFollow" aria-pressed="true" title="自动滚动到底部" aria-label="自动滚动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
  </section>

  <div class="foot">AnCLI · 系统级 AI CLI 环境管理器</div>
</main>

<div class="overlay" id="cfgOverlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cfgTitle">
    <div class="dlg-head">
      <h3 id="cfgTitle">配置</h3>
      <button class="icon-btn" id="cfgClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <div class="note" id="presetNote"></div>
      <div class="chips" id="presetBar"></div>
      <div class="fields" id="cfgFields"></div>
    </div>
    <div class="dlg-foot">
      <button class="btn" id="cfgCancel">取消</button>
      <button class="btn primary" id="cfgSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   AnCLI WebUI — 通过 KernelSU / APatch 的 exec 接口驱动容器内的 ancli
   ===================================================================== */

// ---------- KernelSU / KsuWebUI / APatch bridge ----------
const BRIDGE_NAMES = ['ksu', 'ksu_webui', 'ap_webui', 'ksuwebui'];
let bridge = null;
let bridgeName = null;
let bridgeLogged = false;
let ANCLI = 'ancli';
let currentApps = [];

function findBridge() {
  for (const n of BRIDGE_NAMES) {
    if (window[n] && typeof window[n].exec === 'function') return { obj: window[n], name: n };
  }
  return null;
}

function waitForBridge(timeoutMs) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      const b = findBridge();
      if (b) { clearInterval(timer); resolve(b); return; }
      if (Date.now() - t0 > timeoutMs) {
        clearInterval(timer);
        reject(new Error('等待 WebUI 桥接超时（需要 KernelSU 0.9.5+ / APatch / KsuWebUI）'));
      }
    }, 100);
  });
}

function execOnBridge(b, cmd, name) {
  return new Promise((resolve, reject) => {
    let done = false;
    const finish = (errno, stdout, stderr) => {
      if (done) return;
      done = true;
      resolve({ code: (errno === undefined ? 0 : errno), stdout: stdout || '', stderr: stderr || '' });
    };
    const timeout = setTimeout(() => {
      if (!done) { done = true; reject(new Error('命令执行超时: ' + cmd.slice(0, 60))); }
    }, 180000);
    try {
      if (name === 'ksu') {
        window.__ancliCbCounter = (window.__ancliCbCounter || 0) + 1;
        const cbName = 'ancli_cb_' + Date.now() + '_' + window.__ancliCbCounter;
        window[cbName] = (errno, stdout, stderr) => {
          delete window[cbName];
          clearTimeout(timeout);
          finish(errno, stdout, stderr);
        };
        b.exec(cmd, '{}', cbName);
      } else {
        const ret = b.exec(cmd, finish);
        if (ret && typeof ret.then === 'function') {
          ret.then(r => { clearTimeout(timeout); finish(r && (r.code !== undefined ? r.code : r.errno), r && r.stdout, r && r.stderr); },
                   e => { clearTimeout(timeout); if (!done) { done = true; reject(e); } });
        } else if (ret && typeof ret === 'object') {
          clearTimeout(timeout);
          finish(ret.code !== undefined ? ret.code : ret.errno, ret.stdout, ret.stderr);
        }
      }
    } catch (e) {
      clearTimeout(timeout);
      if (!done) { done = true; reject(e); }
    }
  });
}

async function execCmd(cmd) {
  if (!bridge) {
    try {
      const found = await waitForBridge(10000);
      bridge = found.obj;
      bridgeName = found.name;
      if (!bridgeLogged) { bridgeLogged = true; logLine('已连接 KernelSU WebUI 桥接', 'dim'); }
    } catch (e) {
      try { return await shHttp(cmd); }
      catch (e2) { throw new Error('WebUI 桥接不可用（等待超时且 KKHTTP 失败）：需要 KernelSU 0.9.5+ 或 KsuWebUI 框架'); }
    }
  }
  return await execOnBridge(bridge, cmd, bridgeName);
}

const sh = execCmd;

async function shHttp(cmd) {
  const ports = [8443, 8080];
  let lastErr = null;
  for (const port of ports) {
    try {
      const r = await fetch('http://127.0.0.1:' + port + '/exec?cmd=' + encodeURIComponent(cmd), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('KKHTTP 不可用');
}

const strip = s => (s || '').replace(/\x1b\[[0-9;]*m/g, '');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 输出面板 ----------
const LOG_MAX = 500;
let logLines = 0;
let logFollow = true;
const logEl = () => document.getElementById('log');

function logLine(text, kind) {
  const el = logEl();
  const row = document.createElement('div');
  if (kind) row.className = 'l-' + kind;
  row.textContent = text;
  el.appendChild(row);
  while (el.childElementCount > LOG_MAX) el.removeChild(el.firstElementChild);
  logLines++;
  document.getElementById('logCount').textContent = logLines + ' 行' + (logLines > LOG_MAX ? '（仅保留最近 ' + LOG_MAX + ' 行）' : '');
  if (logFollow) el.scrollTop = el.scrollHeight;
}

function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'err' ? ' err' : '');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => { el.className = 'toast'; }, 2600);
}

// ---------- 忙碌状态 ----------
let busy = 0;
function setBusy(on, label) {
  busy = Math.max(0, busy + (on ? 1 : -1));
  document.body.classList.toggle('busy', busy > 0);
  document.getElementById('busySpin').hidden = busy === 0;
  ['btnCheck', 'btnRefresh', 'btnRepair'].forEach(id => { document.getElementById(id).disabled = busy > 0; });
  document.querySelectorAll('#apps button[data-act]').forEach(b => { b.disabled = busy > 0; });
  if (on && label) logLine(label, 'dim');
}

// ---------- 命令执行 ----------
// `quiet` hides the (machine-readable) stdout of internal JSON calls while still
// surfacing failures: the console should show user actions, not payload dumps.
async function run(cmd, quiet) {
  logLine('$ ' + cmd, quiet ? 'dim' : 'cmd');
  try {
    const r = await sh(cmd);
    const out = strip(r.stdout || '').trim();
    const err = strip(r.stderr || '').trim();
    if (out && !quiet) logLine(out);
    if (err) logLine(err, 'err');
    if (r.code !== 0) {
      if (quiet && out) logLine(out, 'err');
      logLine('exit code: ' + r.code, 'err');
    }
    return r;
  } catch (e) {
    logLine(String(e), 'err');
    throw e;
  }
}

async function ancli(args, quiet) {
  const r = await run(ANCLI + ' ' + args, quiet);
  if (r.code !== 0) throw new Error('ancli ' + args + ' failed');
  return strip(r.stdout || '');
}

// 后台执行 + 实时输出（每次运行独立日志文件，避免两个任务互相串台）
async function runBackground(cmd) {
  const tag = Date.now() + '_' + Math.floor(Math.random() * 100000);
  const logFile = '/data/local/tmp/ancli/.webui_' + tag + '.log';
  const exitFile = logFile + '.exit';
  logLine('$ ' + cmd + '  （后台执行）', 'cmd');
  try {
    const r = await execCmd("sh -c '" + cmd + ' > ' + logFile + ' 2>&1; echo $? > ' + exitFile + "' &");
    if (r.code !== 0 && !r.stdout && !r.stderr) {
      logLine('后台任务启动失败（exit ' + r.code + '）', 'err');
      return;
    }
  } catch (e) {
    logLine('后台任务启动失败: ' + e, 'err');
    return;
  }
  let last = 0;
  for (;;) {
    await sleep(1200);
    let out;
    try { out = await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null'); }
    catch (e) { continue; }
    const text = strip(out.stdout || '');
    if (text) {
      logLine(text.replace(/\n$/, ''));
      // `tail -c` 按字节计数：必须用 UTF-8 字节长度推进，否则会重复读取或截断中文
      last += new TextEncoder().encode(out.stdout || '').length;
    }
    let done;
    try { done = await execCmd('[ -f ' + exitFile + ' ] && cat ' + exitFile + ' || echo -n'); }
    catch (e) { continue; }
    const code = (done.stdout || '').trim();
    if (code !== '') {
      try {
        const rest = strip((await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null')).stdout || '');
        if (rest) logLine(rest.replace(/\n$/, ''));
      } catch (e) { /* ignore */ }
      if (code === '0') logLine('✓ 完成', 'ok');
      else logLine('退出码: ' + code + '（命令失败，未生效）', 'err');
      try { await execCmd('rm -f ' + logFile + ' ' + exitFile); } catch (e) { /* ignore */ }
      break;
    }
  }
}

// ---------- 数据 ----------
async function findAncli() {
  const candidates = [
    '/data/adb/ksu/bin/ancli',
    '/data/adb/ap/bin/ancli',
    '/data/adb/modules/ancli/system/bin/ancli',
    '/data/local/tmp/ancli/bin/ancli',
  ];
  for (const p of candidates) {
    try {
      const r = await sh('[ -x ' + p + ' ] && echo yes');
      if (r.code === 0 && strip(r.stdout).trim() === 'yes') return p;
    } catch (e) { /* next */ }
  }
  return 'ancli';
}

function setStat(id, text, state) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'v' + (state ? ' ' + state : '');
}

async function loadStatus() {
  try {
    const s = JSON.parse(await ancli('status --json', true));
    document.getElementById('stVer').textContent = 'v' + (s.ancli_version || '?');
    setStat('stRootfs', s.rootfs_ready ? '就绪' : '缺失', s.rootfs_ready ? 'ok' : 'bad');
    setStat('stProot', s.proot_deployed ? '已部署' : '缺失', s.proot_deployed ? 'ok' : 'bad');
    setStat('stCount', (s.installed_count ?? '?') + ' 个');
  } catch (e) {
    logLine('状态加载失败: ' + e, 'err');
  }
}

let lastCheck = 0;
let lastCheckFailed = 0;
let checkTtl = 21600;
let supportsCheck = false;
let autoCheckStarted = false;

async function loadApps() {
  const wrap = document.getElementById('apps');
  if (!wrap.childElementCount) wrap.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const data = JSON.parse(await ancli('list --json', true));
    currentApps = data.apps || [];
    lastCheck = data.last_check || 0;
    lastCheckFailed = data.check_failed || 0;
    if (typeof data.check_ttl === 'number' && data.check_ttl > 0) checkTtl = data.check_ttl;
    supportsCheck = (typeof data.check_ttl === 'number');
    if (data.ancli_version) document.getElementById('stVer').textContent = 'v' + data.ancli_version;
    renderApps(currentApps);
    renderCheckInfo();
  } catch (e) {
    wrap.innerHTML = '<div class="empty">加载失败：' + esc(e.message || e) + '</div>';
    logLine('应用列表加载失败: ' + e, 'err');
  }
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const SOURCE_LABELS = [
  [/^github:/, '官方 GitHub'],
  [/^pypi:/, '官方 PyPI'],
  [/^npm:/, '官方 npm'],
  [/^manifest$/, '官方发布清单'],
  [/^channel$/, '官方通道'],
  [/^registry$/, 'registry 声明'],
  [/^none$/, '无官方接口'],
];
function srcLabel(src) {
  for (const pair of SOURCE_LABELS) if (pair[0].test(src || '')) return pair[1];
  return src || '未知来源';
}

function fmtAge(sec) {
  if (sec < 60) return sec + ' 秒';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟';
  if (sec < 86400) return Math.floor(sec / 3600) + ' 小时';
  return Math.floor(sec / 86400) + ' 天';
}

function renderCheckInfo() {
  const el = document.getElementById('checkInfo');
  if (!supportsCheck) { el.textContent = '当前模块版本不支持版本检查'; return; }
  if (!lastCheck) { el.textContent = '尚未检查官方版本'; return; }
  const age = Math.max(0, Math.floor(Date.now() / 1000) - lastCheck);
  let msg = '上次检查 ' + fmtAge(age) + '前';
  if (lastCheckFailed) msg += ' · ' + lastCheckFailed + ' 项查询失败';
  el.textContent = msg;
}

function renderApps(apps) {
  const wrap = document.getElementById('apps');
  const pending = apps.filter(a => a.installed && a.update_available).length;
  setStat('stUpdates', pending ? pending + ' 个' : '无', pending ? null : 'ok');
  setStat('stCount', apps.filter(a => a.installed).length + ' 个');
  if (!apps.length) {
    wrap.innerHTML = '<div class="card empty">registry 中没有可用工具 — 点「检查更新」拉取云端 registry</div>';
    return;
  }
  wrap.innerHTML = apps.map(a => {
    const chips = [];
    let state = 'idle';
    if (a.native) { chips.push('<span class="chip info"><span class="dot"></span>native 直跑</span>'); state = 'native'; }

    if (a.installed) {
      if (a.active) {
        state = a.update_available ? 'update' : 'installed';
        const ver = (a.installed_version && a.installed_version !== 'unknown') ? ' v' + esc(a.installed_version) : '';
        chips.push('<span class="chip' + (a.version_verified ? ' ok' : ' warn') + '"><span class="dot"></span>已安装' + ver +
                   (a.version_verified ? '' : ' · 未核实') + '</span>');
      } else {
        state = 'broken';
        chips.push('<span class="chip danger"><span class="dot"></span>已损坏</span>');
      }
      if (a.update_available) {
        chips.push('<span class="chip update"><span class="dot"></span>可更新 → v' + esc(a.cloud_version) + '</span>');
      } else if (!a.cloud_version || a.cloud_version === 'unknown' || a.cloud_source === 'none') {
        chips.push('<span class="chip plain">官方版本未知</span>');
      }
      if (a.cloud_error) chips.push('<span class="chip danger">版本查询失败</span>');
    } else {
      chips.push('<span class="chip plain">未安装</span>');
    }

    const details = [];
    if (a.installed && a.cloud_version && a.cloud_version !== 'unknown' && a.cloud_source !== 'none') {
      const label = a.cloud_checked ? '官方最新' : '参考版本';
      details.push(label + ' <b>v' + esc(a.cloud_version) + '</b> · ' + esc(srcLabel(a.cloud_source)) +
                   (a.cloud_error ? ' · 查询失败' : ''));
    }
    const keys = a.configured_keys || [];
    if (keys.length) details.push('已配置 ' + esc(keys.join(' · ')));
    if (a.installed && !a.version_verified) details.push('本地版本来自旧记录，点「检查更新」读取工具真实版本');

    const hasEnv = (a.required_env_vars && a.required_env_vars.length) ||
                   (a.optional_env_vars && a.optional_env_vars.length);
    const btns = [];
    if (!a.installed) {
      btns.push('<button class="btn xs primary" data-act="install">安装</button>');
    } else {
      btns.push('<button class="btn xs' + (a.update_available ? ' primary' : '') + '" data-act="update" title="' +
                esc('从官方源拉取最新：' + (a.update_cmd || ('ancli update ' + a.id))) + '">更新</button>');
      if (hasEnv) btns.push('<button class="btn xs" data-act="config">配置</button>');
      btns.push('<button class="btn xs danger" data-act="uninstall">卸载</button>');
    }

    const who = a.id || a.name || '?';
    const initial = esc(String(a.name || who).trim().charAt(0).toUpperCase());
    return '<div class="app" data-state="' + state + '" data-id="' + esc(a.id) + '">' +
             '<div class="mono" aria-hidden="true">' + initial + '</div>' +
             '<div class="app-main">' +
               '<div class="app-title"><span class="name">' + esc(a.name) + '</span>' + chips.join('') + '</div>' +
               (a.description ? '<div class="desc">' + esc(a.description) + '</div>' : '') +
               (details.length ? '<div class="detail">' + details.join('<br>') + '</div>' : '') +
             '</div>' +
             '<div class="app-actions">' + btns.join('') + '</div>' +
           '</div>';
  }).join('');
}

// ---------- 动作 ----------
async function doInstall(id) {
  const app = currentApps.find(a => a.id === id) || { name: id };
  if (!confirm('安装 ' + app.name + '？\n首次安装需要下载依赖，耗时较长（后台执行，可继续浏览）。')) return;
  setBusy(true, '开始安装 ' + app.name);
  try { await runBackground(ANCLI + ' install ' + id); }
  finally { setBusy(false); await loadApps(); await loadStatus(); }
}

async function doUpdate(id) {
  const app = currentApps.find(a => a.id === id) || { name: id };
  if (!app.update_available) {
    logLine('检测显示 ' + app.name + ' 已是 v' + (app.installed_version || '?') + '，仍将从官方源重新拉取最新版本。', 'dim');
  }
  setBusy(true, '开始更新 ' + app.name);
  try { await runBackground(ANCLI + ' update ' + id); }
  finally { setBusy(false); await loadApps(); await loadStatus(); }
}

async function doUninstall(id) {
  const app = currentApps.find(a => a.id === id) || { name: id };
  if (!confirm('卸载 ' + app.name + '？\n（用户数据与密钥会保留，只有再安装时才会用到）')) return;
  setBusy(true);
  try { await ancli('uninstall ' + id); }
  catch (e) { /* 已在输出面板记录 */ }
  finally { setBusy(false); await loadApps(); await loadStatus(); }
}

async function doCheck() {
  if (!supportsCheck) { toast('当前模块版本不支持版本检查，请先更新 AnCLI 模块', 'err'); return; }
  setBusy(true, '查询官方最新版本…');
  try { await runBackground(ANCLI + ' check'); }
  finally { setBusy(false); await loadApps(); await loadStatus(); }
}

async function doRepair() {
  if (!confirm('运行环境修复？\n会重写 DNS、权限、wrapper，并统一全局 skills 目录。')) return;
  setBusy(true, '修复环境中…');
  try { await runBackground(ANCLI + ' repair'); }
  finally { setBusy(false); await loadStatus(); await loadApps(); }
}

async function maybeAutoCheck() {
  if (autoCheckStarted || !supportsCheck) return;
  const age = lastCheck ? Math.floor(Date.now() / 1000) - lastCheck : Infinity;
  if (age < checkTtl) return;
  if (!currentApps.some(a => a.installed)) return;
  autoCheckStarted = true;
  logLine('官方版本信息已过期（' + (lastCheck ? fmtAge(age) + '前' : '从未检查') + '），自动检查…', 'dim');
  setBusy(true);
  try { await runBackground(ANCLI + ' check'); }
  finally { setBusy(false); await loadApps(); }
}

function buildPresetBar(app) {
  const bar = document.getElementById('presetBar');
  const fields = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  const relevant = fields.some(f => BASE_FIELDS.includes(f) || MODEL_FIELDS.includes(f));
  bar.innerHTML = '';
  if (!relevant) { document.getElementById('presetNote').textContent = ''; return; }
  for (const p of PROVIDERS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p.name;
    b.onclick = () => applyProvider(p);
    if (selectedProvider && selectedProvider.id === p.id) b.classList.add('sel');
    bar.appendChild(b);
  }
}

  document.querySelectorAll('#cfgFields input, #cfgFields select').forEach(el => { vals[el.dataset.var] = el.value; });
  const vars = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  const wrap = document.getElementById('cfgFields');

  const fieldHtml = v => {
    const required = (app.required_env_vars || []).includes(v);
    const isModel = MODEL_FIELDS.includes(v);
    const isCompatKey = COMPAT_KEYS.includes(v);

    let label = v;
    let placeholder = VAR_HINTS[v] || '可选的 API 密钥 / 地址 / 配置项';
    let hint = VAR_HINTS[v] || '';
    if (selectedProvider && isCompatKey) {
      label = selectedProvider.name + ' API 密钥';
      placeholder = '申请密钥: ' + selectedProvider.keyUrl;
      hint = '填入 ' + selectedProvider.name + ' 的 API 密钥';
    }

    let field;
    if (isModel && selectedProvider) {
      const models = selectedProvider.models || [];
      const cur = vals[v] || models[0] || '';
      field = '<select data-var="' + esc(v) + '">' +
        models.map(m => '<option' + (m === cur ? ' selected' : '') + '>' + esc(m) + '</option>').join('') +
        '<option value="__custom__"' + (models.indexOf(cur) < 0 ? ' selected' : '') + '>自定义…</option></select>';
    } else if (selectedProvider && BASE_FIELDS.includes(v)) {
      field = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" value="' +
              esc(selectedProvider.anthropicBase || selectedProvider.base) + '">';
    } else {
      field = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" placeholder="' +
              esc(placeholder) + '" value="' + esc(vals[v] || '') + '">';
    }

    // A hint that merely repeats the placeholder is noise: the placeholder already
    // shows inside the empty field.
    const hintHtml = (hint && hint !== placeholder) ? '<div class="hint">' + esc(hint) + '</div>' : '';
    return '<div class="field"><label>' + esc(label) +
           (required ? '<span class="tag">必填</span>' : '') + '</label>' + field + hintHtml + '</div>';
  };

  // Proxy plumbing is rarely the reason someone opens this dialog: keep it folded.
  const ADVANCED = ['HTTP_PROXY', 'HTTPS_PROXY', 'ALL_PROXY', 'NO_PROXY'];
  const primary = vars.filter(v => !ADVANCED.includes(v));
  const advanced = vars.filter(v => ADVANCED.includes(v));
  wrap.innerHTML = primary.map(fieldHtml).join('') +
    (advanced.length
      ? '<details class="adv"><summary>高级 · 代理设置（' + advanced.length + '）</summary>' +
        advanced.map(fieldHtml).join('') + '</details>'
      : '');

  wrap.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', () => {
      if (sel.value === '__custom__') {
        const v = sel.dataset.var;
        sel.outerHTML = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" placeholder="输入模型名，如 deepseek-v4-flash">';
      }
    });
  });
}

function openConfig(id) {
  const app = currentApps.find(a => a.id === id);
  if (!app) return;
  const vars = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  if (!vars.length) { toast('该工具没有可配置的环境变量'); return; }
  cfgApp = app;
  selectedProvider = null;
  document.getElementById('cfgTitle').textContent = '配置 ' + app.name;
  document.getElementById('cfgFields').innerHTML = '';
  document.getElementById('presetNote').textContent = '';
  buildPresetBar(app);
  renderCfgFields(app);
  const ov = document.getElementById('cfgOverlay');
  ov.classList.add('show');
  ov.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeConfig() {
  const ov = document.getElementById('cfgOverlay');
  ov.classList.remove('show');
  ov.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

async function saveConfig() {
  if (!cfgApp) return;
  const sets = [];
  document.querySelectorAll('#cfgFields input, #cfgFields select').forEach(el => {
    const v = el.value.trim();
    if (v && v !== '__custom__') sets.push('--set ' + encodeURIComponent(el.dataset.var) + '=' + encodeURIComponent(v));
  });
  const id = cfgApp.id;
  closeConfig();
  if (!sets.length) { toast('没有填写任何内容，未做修改'); return; }
  setBusy(true, '写入配置…');
  try {
    await ancli('config ' + id + ' ' + sets.join(' '));
    toast('配置已保存');
  } catch (e) { toast('配置保存失败，见输出', 'err'); }
  finally { setBusy(false); await loadApps(); }
}

/* ================= 事件绑定 ================= */
document.getElementById('apps').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || busy > 0) return;
  const host = btn.closest('.app');
  if (!host) return;
  const id = host.dataset.id;
  const act = btn.dataset.act;
  if (act === 'install') doInstall(id);
  else if (act === 'update') doUpdate(id);
  else if (act === 'config') openConfig(id);
  else if (act === 'uninstall') doUninstall(id);
});

document.getElementById('btnCheck').onclick = doCheck;
document.getElementById('btnRefresh').onclick = async () => {
  setBusy(true, '刷新状态…');
  try { await loadStatus(); await loadApps(); }
  finally { setBusy(false); }
};
document.getElementById('btnRepair').onclick = doRepair;

document.getElementById('cfgCancel').onclick = closeConfig;
document.getElementById('cfgClose').onclick = closeConfig;
document.getElementById('cfgSave').onclick = saveConfig;
document.getElementById('cfgOverlay').addEventListener('click', e => {
  if (e.target.id === 'cfgOverlay') closeConfig();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('cfgOverlay').classList.contains('show')) closeConfig();
});

document.getElementById('btnLogClear').onclick = () => {
  logEl().innerHTML = '';
  logLines = 0;
  document.getElementById('logCount').textContent = '0 行';
};
document.getElementById('btnLogFollow').onclick = e => {
  logFollow = !logFollow;
  e.currentTarget.setAttribute('aria-pressed', String(logFollow));
  if (logFollow) logEl().scrollTop = logEl().scrollHeight;
};
document.getElementById('btnLogCopy').onclick = async () => {
  const text = logEl().innerText;
  if (!text) { toast('输出为空'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('已复制输出');
  } catch (e) { toast('复制失败，请长按选择文本', 'err'); }
};

// ---------- 软键盘检测（弹出时关掉模糊，避免卡顿/闪屏） ----------
function setupImeGuard() {
  const vv = window.visualViewport;
  const mark = open => {
    document.body.classList.toggle('ime-open', open);
    if (open) {
      const inp = document.activeElement;
      if (inp && (inp.tagName === 'INPUT' || inp.tagName === 'SELECT')) {
        try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ }
      }
    }
  };
  if (!vv) {
    let lastH = window.innerHeight;
    window.addEventListener('resize', () => {
      const h = window.innerHeight;
      if (Math.abs(lastH - h) > 120) { mark(h < lastH); lastH = h; }
    });
    return;
  }
  vv.addEventListener('resize', () => { mark(vv.height < window.innerHeight * 0.72); });
}

// ---------- 主题 ----------
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'auto') {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
  } else {
    root.setAttribute('data-theme', mode);
  }
  document.querySelectorAll('#themeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.theme === mode));
  try { localStorage.setItem('ancli_theme', mode); } catch (e) { /* ignore */ }
}
document.querySelectorAll('#themeSwitch button').forEach(b => { b.onclick = () => applyTheme(b.dataset.theme); });
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    let saved = 'auto';
    try { saved = localStorage.getItem('ancli_theme') || 'auto'; } catch (e) { /* ignore */ }
    if (saved === 'auto') applyTheme('auto');
  });
}

// ---------- 启动 ----------
(async function init() {
  setupImeGuard();
  let saved = 'auto';
  try { saved = localStorage.getItem('ancli_theme') || 'auto'; } catch (e) { /* ignore */ }
  applyTheme(saved);
  // 清理上次页面被关闭/任务中断时残留的单次日志（2 小时前）
  try { execCmd("find /data/local/tmp/ancli -maxdepth 1 -name '.webui_*.log*' -mmin +120 -delete 2>/dev/null"); }
  catch (e) { /* ignore */ }
  ANCLI = await findAncli();
  await loadStatus();
  await loadApps();
  await maybeAutoCheck();
})();
</script>
