<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnCLI WebUI</title>
<style>
:root {
  --bg: #0f1115; --card: #171a21; --border: #262b36; --text: #d8dee9;
  --muted: #7d8590; --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b;
  --err: #ef4444; --native: #a855f7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font:14px/1.6 system-ui,-apple-system,sans-serif; padding:16px; }
h1 { font-size:18px; margin-bottom:4px; }
.sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
.card .k { color:var(--muted); font-size:11px; }
.card .v { font-size:16px; font-weight:600; margin-top:2px; }
.card .v.ok { color:var(--ok); } .card .v.bad { color:var(--err); }
.app { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
.app .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.app .name { font-weight:600; font-size:15px; }
.app .desc { color:var(--muted); font-size:12px; margin:4px 0 10px; }
.badge { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--border); color:var(--muted); }
.badge.native { border-color:var(--native); color:var(--native); }
.badge.installed { border-color:var(--ok); color:var(--ok); }
.badge.broken { border-color:var(--err); color:var(--err); }
.badge.update { border-color:var(--warn); color:var(--warn); }
.btns { display:flex; gap:8px; flex-wrap:wrap; }
button { background:#232936; color:var(--text); border:1px solid var(--border); border-radius:8px;
  padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s; }
button:hover { border-color:var(--accent); color:#fff; }
button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger:hover { border-color:var(--err); color:var(--err); }
button.small { padding:3px 10px; font-size:12px; }
#log { background:#0a0c10; border:1px solid var(--border); border-radius:10px; padding:12px;
  font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-all;
  max-height:260px; overflow:auto; color:#9fb3c8; margin-top:20px; }
#log .err { color:var(--err); } #log .ok { color:var(--ok); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:10; }
.overlay.show { display:flex; }
.dialog { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; width:min(90vw,420px); }
.dialog h3 { margin-bottom:12px; }
.dialog label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
.dialog input { width:100%; background:#0a0c10; border:1px solid var(--border); border-radius:8px;
  color:var(--text); padding:8px 10px; font-size:13px; }
.dialog input:focus { outline:none; border-color:var(--accent); }
.dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.hint { color:var(--muted); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<h1>AnCLI 管理</h1>
<div class="sub">Unified Linux CLI environment manager · KernelSU WebUI</div>

<div class="cards" id="statusCards">
  <div class="card"><div class="k">AnCLI 版本</div><div class="v" id="stVer">…</div></div>
  <div class="card"><div class="k">容器 Rootfs</div><div class="v" id="stRootfs">…</div></div>
  <div class="card"><div class="k">PRoot</div><div class="v" id="stProot">…</div></div>
  <div class="card"><div class="k">已安装工具</div><div class="v" id="stCount">…</div></div>
</div>

<div style="display:flex; gap:8px; margin-bottom:14px;">
  <button id="btnRepair" class="primary">修复环境 (repair)</button>
  <button id="btnRefresh">刷新</button>
</div>

<div id="apps"></div>

<div id="log"></div>

<div class="overlay" id="cfgOverlay">
  <div class="dialog">
    <h3 id="cfgTitle">配置</h3>
    <div id="cfgFields"></div>
    <div class="hint">留空表示跳过；已保存的密钥不会回显。</div>
    <div class="row">
      <button id="cfgCancel">取消</button>
      <button id="cfgSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
'use strict';
let ANCLI = null;      // resolved ancli command path
let currentApps = [];  // last list --json payload
let cfgApp = null;     // app being configured

// ---------- KernelSU / KsuWebUI bridge ----------
// KernelSU natively injects `window.ksu` (API: ksu.exec(cmd, optionsJson,
// callbackName), callback registered on window). KsuWebUI framework and
// APatch expose ksu_webui / ap_webui instead. The object may be injected
// AFTER the page starts loading — poll until it appears.
const BRIDGE_NAMES = ['ksu', 'ksu_webui', 'ap_webui', 'ksuwebui'];
let bridge = null;
let bridgeName = null;

function findBridge() {
  for (const n of BRIDGE_NAMES) {
    if (window[n] && typeof window[n].exec === 'function') {
      return { obj: window[n], name: n };
    }
  }
  return null;
}

function waitForBridge(timeoutMs) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      const b = findBridge();
      if (b) { clearInterval(timer); resolve(b); return; }
      if (Date.now() - t0 > timeoutMs) {
        clearInterval(timer);
        reject(new Error('等待 WebUI 桥接超时（需要 KernelSU 0.9.5+ / APatch / KsuWebUI）'));
      }
    }, 100);
  });
}

// exec with support for:
//  - native KernelSU `ksu`: exec(cmd, optionsJson, callbackName) with the
//    callback registered as window[callbackName] = (errno, stdout, stderr)
//  - KsuWebUI/APatch: exec(cmd, callback) or exec(cmd) -> Promise
function execOnBridge(b, cmd, name) {
  return new Promise((resolve, reject) => {
    let done = false;
    const finish = (errno, stdout, stderr) => {
      if (done) return;
      done = true;
      resolve({ code: (errno === undefined ? 0 : errno), stdout: stdout || '', stderr: stderr || '' });
    };
    const timeout = setTimeout(() => {
      if (!done) { done = true; reject(new Error('命令执行超时: ' + cmd.slice(0, 60))); }
    }, 180000);
    try {
      if (name === 'ksu') {
        // Native KernelSU: callback-style via a global function name
        window.__ancliCbCounter = (window.__ancliCbCounter || 0) + 1;
        const cbName = 'ancli_cb_' + Date.now() + '_' + window.__ancliCbCounter;
        window[cbName] = (errno, stdout, stderr) => {
          delete window[cbName];
          clearTimeout(timeout);
          finish(errno, stdout, stderr);
        };
        b.exec(cmd, '{}', cbName);
      } else {
        // KsuWebUI / APatch style: callback or Promise
        const ret = b.exec(cmd, finish);
        if (ret && typeof ret.then === 'function') {
          ret.then(r => { clearTimeout(timeout); finish(r && (r.code !== undefined ? r.code : r.errno), r && r.stdout, r && r.stderr); },
                   e => { clearTimeout(timeout); if (!done) { done = true; reject(e); } });
        } else if (ret && typeof ret === 'object') {
          clearTimeout(timeout);
          finish(ret.code !== undefined ? ret.code : ret.errno, ret.stdout, ret.stderr);
        }
        // callback style: finish() will fire later
      }
    } catch (e) {
      clearTimeout(timeout);
      if (!done) { done = true; reject(e); }
    }
  });
}

// Unified executor: JS bridge first (polled), KKHTTP as fallback
async function execCmd(cmd) {
  if (!bridge) {
    try {
      const found = await waitForBridge(10000);
      bridge = found.obj;
      bridgeName = found.name;
      log('桥接已连接: window.' + found.name);
    } catch (e) {
      // No JS bridge — try KsuWebUI's KKHTTP endpoint before giving up
      try { return await shHttp(cmd); }
      catch (e2) { throw new Error('WebUI 桥接不可用（等待超时且 KKHTTP 失败）：需要 KernelSU 0.9.5+ 或 KsuWebUI 框架'); }
    }
  }
  return await execOnBridge(bridge, cmd, bridgeName);
}

const sh = execCmd; // alias kept for callers

// KsuWebUI (framework) HTTP fallback — tried only when no JS bridge exists
async function shHttp(cmd) {
  const ports = [8443, 8080];
  let lastErr = null;
  for (const port of ports) {
    try {
      const r = await fetch('http://127.0.0.1:' + port + '/exec?cmd=' + encodeURIComponent(cmd), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('KKHTTP 不可用');
}

const strip = s => (s || '').replace(/\x1b\[[0-9;]*m/g, '');

function log(text, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function run(cmd) {
  log('$ ' + cmd);
  try {
    const r = await sh(cmd);
    const out = strip(r.stdout || '').trim();
    const err = strip(r.stderr || '').trim();
    if (out) log(out);
    if (err) log(err, 'err');
    if (r.code !== 0) log('exit code: ' + r.code, 'err');
    else log('✓ 完成', 'ok');
    return r;
  } catch (e) {
    log(String(e), 'err');
    throw e;
  }
}

async function ancli(args) {
  const r = await run(ANCLI + ' ' + args);
  if (r.code !== 0) throw new Error('ancli ' + args + ' failed');
  return strip(r.stdout || '');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Run a long command in the background (output redirected to a log file) and
// poll the log. The KernelSU JS bridge blocks the WebView while a command
// runs, so installs/updates would freeze the UI; backgrounding keeps the
// page responsive and streams progress into the log area.
async function runBackground(cmd) {
  const logFile = '/data/local/tmp/ancli/.webui_last.log';
  const exitFile = logFile + '.exit';
  log('$ ' + cmd + '  （后台执行）');
  try {
    // Shell-quote guard: cmd contains no single quotes (paths/ids only).
    const r = await execCmd("sh -c '" + cmd + ' > ' + logFile + ' 2>&1; echo $? > ' + exitFile + "' &");
    if (r.code !== 0 && !r.stdout && !r.stderr) {
      log('后台任务启动失败（exit ' + r.code + '）', 'err');
      return;
    }
  } catch (e) {
    log('后台任务启动失败: ' + e, 'err');
    return;
  }
  // Poll: stream new log lines, then wait for the exit marker file.
  let last = 0;
  for (;;) {
    await sleep(1200);
    let out;
    try { out = await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null'); }
    catch (e) { continue; }
    const text = strip(out.stdout || '');
    if (text) { log(text); last += (out.stdout || '').length; }
    let done;
    try { done = await execCmd('[ -f ' + exitFile + ' ] && cat ' + exitFile + ' || echo -n'); }
    catch (e) { continue; }
    const code = (done.stdout || '').trim();
    if (code !== '') {
      try {
        const rest = await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null');
        const restText = strip(rest.stdout || '');
        if (restText) log(restText);
      } catch (e) { /* ignore */ }
      if (code === '0') log('✓ 完成', 'ok'); else log('退出码: ' + code, 'err');
      break;
    }
  }
}

// ---------- init ----------
async function findAncli() {
  const candidates = [
    '/data/adb/ksu/bin/ancli',
    '/data/adb/ap/bin/ancli',
    '/data/local/tmp/ancli/bin/ancli',
    '/data/adb/modules/ancli/system/bin/ancli',
  ];
  for (const p of candidates) {
    try {
      const r = await sh('[ -x ' + p + ' ] && echo yes');
      if (r.code === 0 && strip(r.stdout).trim() === 'yes') return p;
    } catch (e) { /* try next */ }
  }
  return 'ancli';
}

async function loadStatus() {
  try {
    const raw = await ancli('status --json');
    const s = JSON.parse(raw);
    document.getElementById('stVer').textContent = s.ancli_version || '?';
    const rf = document.getElementById('stRootfs');
    rf.textContent = s.rootfs_ready ? '就绪' : '缺失';
    rf.className = 'v ' + (s.rootfs_ready ? 'ok' : 'bad');
    const pr = document.getElementById('stProot');
    pr.textContent = s.proot_deployed ? '已部署' : '缺失';
    pr.className = 'v ' + (s.proot_deployed ? 'ok' : 'bad');
    document.getElementById('stCount').textContent = s.installed_count ?? '?';
  } catch (e) {
    log('状态加载失败: ' + e, 'err');
  }
}

async function loadApps() {
  const wrap = document.getElementById('apps');
  wrap.innerHTML = '<div class="sub">加载中…</div>';
  try {
    const raw = await ancli('list --json');
    const data = JSON.parse(raw);
    currentApps = data.apps || [];
    renderApps(currentApps);
    document.getElementById('stVer').textContent = data.ancli_version || '?';
  } catch (e) {
    wrap.innerHTML = '<div class="sub">加载失败: ' + e + '</div>';
  }
}

function renderApps(apps) {
  const wrap = document.getElementById('apps');
  wrap.innerHTML = '';
  if (!apps.length) { wrap.innerHTML = '<div class="sub">registry 中没有可用工具</div>'; return; }
  for (const a of apps) {
    const el = document.createElement('div');
    el.className = 'app';
    const badges = [];
    if (a.native) badges.push('<span class="badge native">native 直跑</span>');
    if (a.installed) {
      badges.push(a.active
        ? '<span class="badge installed">已安装 v' + a.installed_version + '</span>'
        : '<span class="badge broken">损坏</span>');
      if (a.update_available) badges.push('<span class="badge update">可更新 → v' + a.cloud_version + '</span>');
    } else {
      badges.push('<span class="badge">未安装</span>');
    }
    if (a.configured_keys && a.configured_keys.length)
      badges.push('<span class="badge">已配置: ' + a.configured_keys.join(', ') + '</span>');

    let btns = '';
    if (!a.installed) {
      btns += '<button class="small primary" onclick="doInstall(\'' + a.id + '\')">安装</button>';
    } else {
      btns += '<button class="small" onclick="doUpdate(\'' + a.id + '\')">更新</button>';
      btns += '<button class="small" onclick="openConfig(\'' + a.id + '\')">配置</button>';
      btns += '<button class="small danger" onclick="doUninstall(\'' + a.id + '\')">卸载</button>';
    }
    el.innerHTML =
      '<div class="head"><span class="name">' + esc(a.name) + '</span>' + badges.join('') + '</div>' +
      '<div class="desc">' + esc(a.description) + '</div>' +
      '<div class="btns">' + btns + '</div>';
    wrap.appendChild(el);
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doInstall(id) {
  if (!confirm('安装 ' + id + '？（首次安装会下载 Ubuntu 依赖，耗时较长，后台执行中可继续浏览）')) return;
  await runBackground(ANCLI + ' install ' + id);
  await loadApps();
}

async function doUninstall(id) {
  if (!confirm('卸载 ' + id + '？')) return;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await ancli('uninstall ' + id); } catch (e) { /* logged */ }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
  await loadApps();
}

async function doUpdate(id) {
  await runBackground(ANCLI + ' update ' + id);
  await loadApps();
}

// ---------- env var hints (shown in the config dialog) ----------
const VAR_HINTS = {
  OPENAI_API_KEY: 'OpenAI / 兼容平台 API 密钥（核心认证，必填）',
  ANTHROPIC_API_KEY: 'Anthropic Claude API 密钥',
  GEMINI_API_KEY: 'Google Gemini API 密钥',
  ANTIGRAVITY_API_KEY: 'Antigravity 平台密钥（留空可用 OAuth 登录）',
  DEEPSEEK_API_KEY: 'DeepSeek API 密钥（用 DeepSeek 模型时需要）',
  OPENAI_API_BASE: 'OpenAI 兼容 API 地址（自定义中转，如 https://api.deepseek.com/v1）',
  ANTHROPIC_BASE_URL: 'Claude 兼容 API 地址（自定义中转）',
  AIDER_MODEL: 'aider 默认模型名（如 gpt-4o / deepseek-chat）',
  MIMO_MODEL: 'mimo 默认模型名',
  ANTHROPIC_MODEL: 'claude 默认模型名',
  HTTP_PROXY: 'HTTP 代理地址（如 http://192.168.1.5:7890）',
  HTTPS_PROXY: 'HTTPS 代理地址',
  ALL_PROXY: '全协议代理地址',
  GROK_DEPLOYMENT_KEY: 'Grok 企业部署密钥（个人使用留空）',
  GROK_CHANNEL: 'Grok 频道（stable / beta 等）',
  GROK_PROXY_URL: 'Grok 自定义代理/中转地址',
};

function openConfig(id) {
  const app = currentApps.find(a => a.id === id);
  if (!app) return;
  const vars = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  if (!vars.length) { alert('该工具没有可配置的环境变量'); return; }
  cfgApp = app;
  document.getElementById('cfgTitle').textContent = '配置 ' + app.name;
  const wrap = document.getElementById('cfgFields');
  wrap.innerHTML = vars.map(v => {
    const required = (app.required_env_vars || []).includes(v);
    const hint = VAR_HINTS[v] || '可选的 API 密钥 / 地址 / 配置项';
    return '<label>' + esc(v) + (required ? ' <span style="color:var(--err)">*必填</span>' : ' <span style="color:var(--muted)">可选</span>') +
           '</label>' +
           '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" placeholder="' + esc(hint) + '">' +
           '<div class="hint">' + esc(hint) + '</div>';
  }).join('');
  document.getElementById('cfgOverlay').classList.add('show');
}

document.getElementById('cfgCancel').onclick = () =>
  document.getElementById('cfgOverlay').classList.remove('show');

document.getElementById('cfgSave').onclick = async () => {
  if (!cfgApp) return;
  const sets = [];
  document.querySelectorAll('#cfgFields input').forEach(inp => {
    const v = inp.value.trim();
    if (v) sets.push('--set ' + encodeURIComponent(inp.dataset.var) + '=' + encodeURIComponent(v));
  });
  document.getElementById('cfgOverlay').classList.remove('show');
  if (!sets.length) { await loadApps(); return; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await ancli('config ' + cfgApp.id + ' ' + sets.join(' ')); } catch (e) { /* logged */ }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
  await loadApps();
};

document.getElementById('btnRefresh').onclick = async () => { await loadStatus(); await loadApps(); };

document.getElementById('btnRepair').onclick = async () => {
  if (!confirm('运行 ancli repair（修复环境/权限并重新生成 wrapper）？')) return;
  await runBackground(ANCLI + ' repair');
  await loadStatus(); await loadApps();
};

(async function init() {
  log('AnCLI WebUI 初始化…');
  ANCLI = await findAncli();
  log('ancli 路径: ' + ANCLI);
  await loadStatus();
  await loadApps();
})();
</script>
</body>
</html>
