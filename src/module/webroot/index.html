<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnCLI WebUI</title>
<style>
/* ================= 奶咖色系 · 液态玻璃 · 圆润 ================= */
:root {
  /* latte (light) */
  --bg1: #f3ecdf; --bg2: #ead9c2;
  --glass: rgba(255, 250, 240, 0.58);
  --glass-strong: rgba(255, 250, 240, 0.82);
  --stroke: rgba(255, 255, 255, 0.55);
  --text: #4a3728; --muted: #8d7660; --accent: #c08552; --accent-soft: #e8cfae;
  --ok: #7a9e6b; --warn: #d9a441; --err: #c96a5a; --native: #9a6fb0;
  --shadow: 0 8px 32px rgba(122, 92, 60, 0.14);
}
:root[data-theme="dark"] {
  /* mocha (dark) */
  --bg1: #2b2118; --bg2: #1d1610;
  --glass: rgba(58, 46, 34, 0.55);
  --glass-strong: rgba(58, 46, 34, 0.85);
  --stroke: rgba(255, 240, 220, 0.14);
  --text: #eeddc6; --muted: #a68f74; --accent: #d4a373; --accent-soft: #5a4632;
  --ok: #8fae7e; --warn: #d9a441; --err: #d0816f; --native: #b78fd0;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font: 14px/1.65 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  padding: 18px 16px 32px;
}
h1 { font-size: 19px; font-weight: 700; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }

.glass {
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(1.25);
  -webkit-backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid var(--stroke);
  border-radius: 22px;
  box-shadow: var(--shadow);
}
.header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px 0; }
.theme-switch { display: inline-flex; gap: 4px; background: var(--glass); border: 1px solid var(--stroke);
  border-radius: 999px; padding: 3px; backdrop-filter: blur(12px); }
.theme-switch button { border: 0; background: transparent; color: var(--muted); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; cursor: pointer; transition: .18s; }
.theme-switch button.active { background: var(--glass-strong); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 12px; margin: 16px 0; }
.card { padding: 14px 16px; border-radius: 20px; }
.card .k { color: var(--muted); font-size: 11px; }
.card .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
.card .v.ok { color: var(--ok); } .card .v.bad { color: var(--err); }

.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
button { background: var(--glass); color: var(--text); border: 1px solid var(--stroke); border-radius: 14px;
  padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer; transition: .18s;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-soft)); color: #fff; border: 0; }
button.primary:hover { color: #fff; filter: brightness(1.06); }
button.small { padding: 5px 12px; font-size: 12px; border-radius: 11px; }
button.danger:hover { border-color: var(--err); color: var(--err); }

.app { padding: 16px 18px; margin-bottom: 12px; border-radius: 22px; }
.app .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.app .name { font-weight: 700; font-size: 15px; }
.app .desc { color: var(--muted); font-size: 12px; margin: 5px 0 12px; }
.badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--stroke); color: var(--muted); background: var(--glass); }
.badge.native { border-color: var(--native); color: var(--native); }
.badge.installed { border-color: var(--ok); color: var(--ok); }
.badge.broken { border-color: var(--err); color: var(--err); }
.badge.update { border-color: var(--warn); color: var(--warn); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

#log { margin-top: 20px; padding: 14px 16px; border-radius: 20px; font: 12px/1.55 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow: auto; color: var(--text); opacity: .92; }
#log .err { color: var(--err); } #log .ok { color: var(--ok); }

/* ===== 软键盘弹出降级 =====
   backdrop-filter 在 WebView 视口 resize（键盘弹出）时会反复重采样背景，
   导致卡顿 / 闪屏 / 局部黑屏。检测到键盘后关闭模糊、背景换纯色、面板
   换高不透明度，消除重采样；键盘收起后自动恢复液态玻璃。 */
body.ime-open { background: var(--bg1); background-attachment: scroll; }
body.ime-open .glass,
body.ime-open .dialog,
body.ime-open .theme-switch,
body.ime-open button { backdrop-filter: none; -webkit-backdrop-filter: none; }
body.ime-open .glass { background: var(--glass-strong); }
body.ime-open .dialog { background: var(--glass-strong); }
body.ime-open #log { background: var(--glass-strong); }

.overlay { position: fixed; inset: 0; background: rgba(40, 28, 16, 0.45); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 10; }
.overlay.show { display: flex; }
.dialog { background: var(--glass-strong); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--stroke); border-radius: 26px; padding: 22px; width: min(92vw, 460px);
  box-shadow: 0 20px 60px rgba(60, 40, 20, 0.3); max-height: 86vh; overflow: auto; }
.dialog h3 { margin-bottom: 4px; font-size: 16px; }
.dialog .dsub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.dialog label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; font-weight: 600; }
.dialog input { width: 100%; background: rgba(255,255,255,.25); border: 1px solid var(--stroke); border-radius: 12px;
  color: var(--text); padding: 9px 12px; font-size: 13px; outline: none; transition: .15s; }
.dialog input:focus { border-color: var(--accent); background: rgba(255,255,255,.4); }
.dialog input::placeholder { color: var(--muted); opacity: .7; }
.dialog select { width: 100%; background: rgba(255,255,255,.25); border: 1px solid var(--stroke); border-radius: 12px;
  color: var(--text); padding: 9px 12px; font-size: 13px; outline: none; appearance: auto; -webkit-appearance: auto; }
.dialog select:focus { border-color: var(--accent); }
.dialog select option { background: var(--bg1); color: var(--text); }
.dialog .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.presets button { padding: 4px 11px; font-size: 12px; border-radius: 999px; }
.presets button.sel { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.preset-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
.preset-note a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>☕ AnCLI 管理</h1>
    <div class="sub">Unified Linux CLI environment manager · KernelSU WebUI</div>
  </div>
  <div class="theme-switch" id="themeSwitch">
    <button data-theme="auto" title="跟随系统">🖥 跟随</button>
    <button data-theme="light" title="浅色（奶咖）">☀️ 浅色</button>
    <button data-theme="dark" title="深色（摩卡）">🌙 深色</button>
  </div>
</div>

<div class="cards" id="statusCards">
  <div class="card glass"><div class="k">AnCLI 版本</div><div class="v" id="stVer">…</div></div>
  <div class="card glass"><div class="k">容器 Rootfs</div><div class="v" id="stRootfs">…</div></div>
  <div class="card glass"><div class="k">PRoot</div><div class="v" id="stProot">…</div></div>
  <div class="card glass"><div class="k">已安装工具</div><div class="v" id="stCount">…</div></div>
</div>

<div class="toolbar">
  <button id="btnRepair" class="primary">修复环境 (repair)</button>
  <button id="btnRefresh">刷新</button>
</div>

<div id="apps"></div>

<div class="glass" id="log"></div>

<div class="overlay" id="cfgOverlay">
  <div class="dialog">
    <h3 id="cfgTitle">配置</h3>
    <div class="dsub">选择下方服务商可一键填充 API 地址与模型，再填入对应密钥即可</div>
    <div class="presets" id="presetBar"></div>

    <div class="hint">* 必填；留空表示跳过；已保存的密钥不会回显。</div>
    <div class="row">
      <button id="cfgCancel">取消</button>
      <button id="cfgSave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>

let currentApps = [];  // last list --json payload
let cfgApp = null;     // app being configured

// ---------- 服务商预置（官方文档核实，2026-08 二次复核） ----------

    models: ['qwen3.8-max', 'qwen3.7-plus', 'qwen3.7-flash'], note: '国内直连 · 通义千问' },
  { id: 'kimi',        name: 'Kimi 月之暗面',   base: 'https://api.moonshot.cn/v1',                  keyUrl: 'https://platform.kimi.com/console/api-keys',
    models: ['kimi-k3', 'kimi-k2.7-code', 'kimi-k2.6'], note: '长上下文（1M）' },
  { id: 'xai',         name: 'xAI Grok',       base: 'https://api.x.ai/v1',                         keyUrl: 'https://console.x.ai/team/default/api-keys',
    models: ['grok-4.5', 'grok-4.3'] },
  { id: 'siliconflow', name: '硅基流动',        base: 'https://api.siliconflow.cn/v1',               keyUrl: 'https://cloud.siliconflow.cn/account/ak',
    models: ['deepseek-ai/DeepSeek-V3', 'Qwen/Qwen2.5-72B-Instruct', 'Qwen/Qwen2.5-Coder-32B-Instruct'], note: '国内 · 含免费模型' },
];

// 字段用途提示
const VAR_HINTS = {
  OPENAI_API_KEY: 'OpenAI / 兼容平台 API 密钥（核心认证）',
  ANTHROPIC_API_KEY: 'Anthropic Claude API 密钥',
  GEMINI_API_KEY: 'Google Gemini API 密钥',
  ANTIGRAVITY_API_KEY: 'Antigravity 平台密钥（留空可用 OAuth 登录）',
  DEEPSEEK_API_KEY: 'DeepSeek API 密钥（在 platform.deepseek.com 申请）',
  OPENAI_API_BASE: 'OpenAI 兼容 API 地址（选择服务商后自动填充）',
  ANTHROPIC_BASE_URL: 'Claude 兼容 API 地址（选择服务商后自动填充）',
  AIDER_MODEL: 'aider 默认模型名',
  MIMO_MODEL: 'mimo 默认模型名',
  ANTHROPIC_MODEL: 'claude 默认模型名',
  HTTP_PROXY: 'HTTP 代理地址（如 http://192.168.1.5:7890）',
  HTTPS_PROXY: 'HTTPS 代理地址',
  ALL_PROXY: '全协议代理地址',
  GROK_DEPLOYMENT_KEY: 'Grok 企业部署密钥（个人使用留空）',
  GROK_CHANNEL: 'Grok 频道（stable / beta 等）',
  GROK_PROXY_URL: 'Grok 自定义代理/中转地址',
};
// 会被服务商预置填充的字段
const BASE_FIELDS = ['OPENAI_API_BASE', 'ANTHROPIC_BASE_URL', 'GROK_PROXY_URL'];
const MODEL_FIELDS = ['AIDER_MODEL', 'MIMO_MODEL', 'ANTHROPIC_MODEL'];

// ---------- KernelSU / KsuWebUI bridge ----------
const BRIDGE_NAMES = ['ksu', 'ksu_webui', 'ap_webui', 'ksuwebui'];
let bridge = null;
let bridgeName = null;

function findBridge() {
  for (const n of BRIDGE_NAMES) {
    if (window[n] && typeof window[n].exec === 'function') {
      return { obj: window[n], name: n };
    }
  }
  return null;
}

function waitForBridge(timeoutMs) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      const b = findBridge();
      if (b) { clearInterval(timer); resolve(b); return; }
      if (Date.now() - t0 > timeoutMs) {
        clearInterval(timer);
        reject(new Error('等待 WebUI 桥接超时（需要 KernelSU 0.9.5+ / APatch / KsuWebUI）'));
      }
    }, 100);
  });
}

function execOnBridge(b, cmd, name) {
  return new Promise((resolve, reject) => {
    let done = false;
    const finish = (errno, stdout, stderr) => {
      if (done) return;
      done = true;
      resolve({ code: (errno === undefined ? 0 : errno), stdout: stdout || '', stderr: stderr || '' });
    };
    const timeout = setTimeout(() => {
      if (!done) { done = true; reject(new Error('命令执行超时: ' + cmd.slice(0, 60))); }
    }, 180000);
    try {
      if (name === 'ksu') {
        window.__ancliCbCounter = (window.__ancliCbCounter || 0) + 1;
        const cbName = 'ancli_cb_' + Date.now() + '_' + window.__ancliCbCounter;
        window[cbName] = (errno, stdout, stderr) => {
          delete window[cbName];
          clearTimeout(timeout);
          finish(errno, stdout, stderr);
        };
        b.exec(cmd, '{}', cbName);
      } else {
        const ret = b.exec(cmd, finish);
        if (ret && typeof ret.then === 'function') {
          ret.then(r => { clearTimeout(timeout); finish(r && (r.code !== undefined ? r.code : r.errno), r && r.stdout, r && r.stderr); },
                   e => { clearTimeout(timeout); if (!done) { done = true; reject(e); } });
        } else if (ret && typeof ret === 'object') {
          clearTimeout(timeout);
          finish(ret.code !== undefined ? ret.code : ret.errno, ret.stdout, ret.stderr);
        }
      }
    } catch (e) {
      clearTimeout(timeout);
      if (!done) { done = true; reject(e); }
    }
  });
}

async function execCmd(cmd) {
  if (!bridge) {
    try {
      const found = await waitForBridge(10000);
      bridge = found.obj;
      bridgeName = found.name;
      log('桥接已连接: window.' + found.name);
    } catch (e) {
      try { return await shHttp(cmd); }
      catch (e2) { throw new Error('WebUI 桥接不可用（等待超时且 KKHTTP 失败）：需要 KernelSU 0.9.5+ 或 KsuWebUI 框架'); }
    }
  }
  return await execOnBridge(bridge, cmd, bridgeName);
}

const sh = execCmd;

async function shHttp(cmd) {
  const ports = [8443, 8080];
  let lastErr = null;
  for (const port of ports) {
    try {
      const r = await fetch('http://127.0.0.1:' + port + '/exec?cmd=' + encodeURIComponent(cmd), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('KKHTTP 不可用');
}

const strip = s => (s || '').replace(/\x1b\[[0-9;]*m/g, '');

function log(text, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function run(cmd) {
  log('$ ' + cmd);
  try {
    const r = await sh(cmd);
    const out = strip(r.stdout || '').trim();
    const err = strip(r.stderr || '').trim();
    if (out) log(out);
    if (err) log(err, 'err');
    if (r.code !== 0) log('exit code: ' + r.code, 'err');
    else log('✓ 完成', 'ok');
    return r;
  } catch (e) {
    log(String(e), 'err');
    throw e;
  }
}

async function ancli(args) {
  const r = await run(ANCLI + ' ' + args);
  if (r.code !== 0) throw new Error('ancli ' + args + ' failed');
  return strip(r.stdout || '');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function runBackground(cmd) {
  const logFile = '/data/local/tmp/ancli/.webui_last.log';
  const exitFile = logFile + '.exit';
  log('$ ' + cmd + '  （后台执行）');
  try {
    const r = await execCmd("sh -c '" + cmd + ' > ' + logFile + ' 2>&1; echo $? > ' + exitFile + "' &");
    if (r.code !== 0 && !r.stdout && !r.stderr) {
      log('后台任务启动失败（exit ' + r.code + '）', 'err');
      return;
    }
  } catch (e) {
    log('后台任务启动失败: ' + e, 'err');
    return;
  }
  let last = 0;
  for (;;) {
    await sleep(1200);
    let out;
    try { out = await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null'); }
    catch (e) { continue; }
    const text = strip(out.stdout || '');
    if (text) { log(text); last += (out.stdout || '').length; }
    let done;
    try { done = await execCmd('[ -f ' + exitFile + ' ] && cat ' + exitFile + ' || echo -n'); }
    catch (e) { continue; }
    const code = (done.stdout || '').trim();
    if (code !== '') {
      try {
        const rest = await execCmd('tail -c +' + (last + 1) + ' ' + logFile + ' 2>/dev/null');
        const restText = strip(rest.stdout || '');
        if (restText) log(restText);
      } catch (e) { /* ignore */ }
      if (code === '0') log('✓ 完成', 'ok'); else log('退出码: ' + code, 'err');
      break;
    }
  }
}

// ---------- init ----------
async function findAncli() {
  const candidates = [
    '/data/adb/ksu/bin/ancli',
    '/data/adb/ap/bin/ancli',
    '/data/local/tmp/ancli/bin/ancli',
    '/data/adb/modules/ancli/system/bin/ancli',
  ];
  for (const p of candidates) {
    try {
      const r = await sh('[ -x ' + p + ' ] && echo yes');
      if (r.code === 0 && strip(r.stdout).trim() === 'yes') return p;
    } catch (e) { /* try next */ }
  }
  return 'ancli';
}

async function loadStatus() {
  try {
    const raw = await ancli('status --json');
    const s = JSON.parse(raw);
    document.getElementById('stVer').textContent = s.ancli_version || '?';
    const rf = document.getElementById('stRootfs');
    rf.textContent = s.rootfs_ready ? '就绪' : '缺失';
    rf.className = 'v ' + (s.rootfs_ready ? 'ok' : 'bad');
    const pr = document.getElementById('stProot');
    pr.textContent = s.proot_deployed ? '已部署' : '缺失';
    pr.className = 'v ' + (s.proot_deployed ? 'ok' : 'bad');
    document.getElementById('stCount').textContent = s.installed_count ?? '?';
  } catch (e) {
    log('状态加载失败: ' + e, 'err');
  }
}

async function loadApps() {
  const wrap = document.getElementById('apps');
  wrap.innerHTML = '<div class="sub">加载中…</div>';
  try {
    const raw = await ancli('list --json');
    const data = JSON.parse(raw);
    currentApps = data.apps || [];
    renderApps(currentApps);
    document.getElementById('stVer').textContent = data.ancli_version || '?';
  } catch (e) {
    wrap.innerHTML = '<div class="sub">加载失败: ' + e + '</div>';
  }
}

function renderApps(apps) {
  const wrap = document.getElementById('apps');
  wrap.innerHTML = '';
  if (!apps.length) { wrap.innerHTML = '<div class="sub">registry 中没有可用工具</div>'; return; }
  for (const a of apps) {
    const el = document.createElement('div');
    el.className = 'app glass';
    const badges = [];
    if (a.native) badges.push('<span class="badge native">native 直跑</span>');
    if (a.installed) {
      badges.push(a.active
        ? '<span class="badge installed">已安装 v' + a.installed_version + '</span>'
        : '<span class="badge broken">损坏</span>');
      if (a.update_available) badges.push('<span class="badge update">可更新 → v' + a.cloud_version + '</span>');
    } else {
      badges.push('<span class="badge">未安装</span>');
    }
    if (a.configured_keys && a.configured_keys.length)
      badges.push('<span class="badge">已配置: ' + a.configured_keys.join(', ') + '</span>');

    let btns = '';
    if (!a.installed) {
      btns += '<button class="small primary" onclick="doInstall(\'' + a.id + '\')">安装</button>';
    } else {
      btns += '<button class="small" onclick="doUpdate(\'' + a.id + '\')">更新</button>';
      btns += '<button class="small" onclick="openConfig(\'' + a.id + '\')">配置</button>';
      btns += '<button class="small danger" onclick="doUninstall(\'' + a.id + '\')">卸载</button>';
    }
    el.innerHTML =
      '<div class="head"><span class="name">' + esc(a.name) + '</span>' + badges.join('') + '</div>' +
      '<div class="desc">' + esc(a.description) + '</div>' +
      '<div class="btns">' + btns + '</div>';
    wrap.appendChild(el);
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doInstall(id) {
  if (!confirm('安装 ' + id + '？（首次安装会下载 Ubuntu 依赖，耗时较长，后台执行中可继续浏览）')) return;
  await runBackground(ANCLI + ' install ' + id);
  await loadApps();
}

async function doUninstall(id) {
  if (!confirm('卸载 ' + id + '？')) return;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await ancli('uninstall ' + id); } catch (e) { /* logged */ }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
  await loadApps();
}

async function doUpdate(id) {
  await runBackground(ANCLI + ' update ' + id);
  await loadApps();
}

// ---------- 配置弹窗（含服务商一键预置） ----------
let selectedProvider = null;

// 兼容通道密钥（配合 *_API_BASE 使用，label 跟随 provider）
const COMPAT_KEYS = ['OPENAI_API_KEY', 'ANTHROPIC_API_KEY'];
// 各服务商专属密钥（选了 provider 后提示"一般无需填写"）
const EXTRA_KEYS = ['DEEPSEEK_API_KEY', 'GEMINI_API_KEY', 'ANTIGRAVITY_API_KEY', 'GROK_DEPLOYMENT_KEY'];

function buildPresetBar(app) {
  const bar = document.getElementById('presetBar');
  const fields = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  const hasBase = fields.some(f => BASE_FIELDS.includes(f));
  const hasModel = fields.some(f => MODEL_FIELDS.includes(f));
  bar.innerHTML = '';
  if (!hasBase && !hasModel) {
    document.getElementById('presetNote').textContent = '';
    return;
  }
  for (const p of PROVIDERS) {
    const b = document.createElement('button');
    b.textContent = p.name;
    b.onclick = () => applyProvider(p);
    if (selectedProvider && selectedProvider.id === p.id) b.classList.add('sel');
    bar.appendChild(b);
  }
}

function applyProvider(p) {
  selectedProvider = p;
  buildPresetBar(cfgApp);
  renderCfgFields(cfgApp);
  const note = document.getElementById('presetNote');
  note.innerHTML = '已选择 <b>' + esc(p.name) + '</b>：API 地址与默认模型已填充' +
    (p.note ? ' · ' + esc(p.note) : '') +
    ' · 密钥申请 <a href="' + esc(p.keyUrl) + '" target="_blank" rel="noopener">' + esc(p.keyUrl) + '</a>' +
    '<br>模型下拉可切换：' + esc((p.models || []).join(' / '));
}

// 渲染配置表单（保留已输入的值；模型字段在选中 provider 后变为下拉）
function renderCfgFields(app) {
  // 1) 收集当前值（input + select）
  const vals = {};
  document.querySelectorAll('#cfgFields input, #cfgFields select').forEach(el => {
    vals[el.dataset.var] = el.value;
  });
  const vars = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  const wrap = document.getElementById('cfgFields');
  wrap.innerHTML = vars.map(v => {
    const required = (app.required_env_vars || []).includes(v);
    const isModel = MODEL_FIELDS.includes(v);
    const isCompatKey = COMPAT_KEYS.includes(v);
    const isExtraKey = EXTRA_KEYS.includes(v);

    let label = v;
    let placeholder = VAR_HINTS[v] || '可选的 API 密钥 / 地址 / 配置项';
    let hint = VAR_HINTS[v] || '';
    if (selectedProvider) {
      if (isCompatKey) {
        label = selectedProvider.name + ' API 密钥（' + v + '）';
        placeholder = '申请密钥: ' + selectedProvider.keyUrl;
        hint = '填入 ' + selectedProvider.name + ' 的 API 密钥';
      } else if (isExtraKey) {
        hint += (hint ? ' · ' : '') + '当前已选 ' + selectedProvider.name + '，一般无需填写';
      }
    }

    let field;
    if (isModel && selectedProvider) {
      const models = selectedProvider.models || [];
      const cur = vals[v] || models[0] || '';
      field = '<select data-var="' + esc(v) + '">' +
        models.map(m => '<option' + (m === cur ? ' selected' : '') + '>' + esc(m) + '</option>').join('') +
        '<option value="__custom__"' + (models.indexOf(cur) < 0 ? ' selected' : '') + '>自定义…</option></select>';
    } else if (selectedProvider && BASE_FIELDS.includes(v)) {
      // 选中服务商后 API 地址由预置覆盖
      field = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" value="' + esc(selectedProvider.base) + '">';
    } else {
      field = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" placeholder="' + esc(placeholder) + '" value="' + esc(vals[v] || '') + '">';
    }

    return '<label>' + esc(label) + (required ? ' <span style="color:var(--err)">*必填</span>' : ' <span style="color:var(--muted)">可选</span>') +
           '</label>' + field +
           (hint ? '<div class="hint">' + esc(hint) + '</div>' : '');
  }).join('');

  // select 选"自定义…"时切换回输入框
  wrap.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', () => {
      if (sel.value === '__custom__') {
        const v = sel.dataset.var;
        sel.outerHTML = '<input data-var="' + esc(v) + '" autocomplete="off" spellcheck="false" placeholder="输入模型名，如 deepseek-v4-flash">';
      }
    });
  });
}

function openConfig(id) {
  const app = currentApps.find(a => a.id === id);
  if (!app) return;
  const vars = (app.required_env_vars || []).concat(app.optional_env_vars || []);
  if (!vars.length) { alert('该工具没有可配置的环境变量'); return; }
  cfgApp = app;
  selectedProvider = null;
  document.getElementById('cfgTitle').textContent = '配置 ' + app.name;
  document.getElementById('cfgFields').innerHTML = '';
  document.getElementById('presetNote').textContent = '';
  buildPresetBar(app);
  renderCfgFields(app);
  document.getElementById('cfgOverlay').classList.add('show');
}

document.getElementById('cfgCancel').onclick = () =>
  document.getElementById('cfgOverlay').classList.remove('show');

document.getElementById('cfgSave').onclick = async () => {
  if (!cfgApp) return;
  const sets = [];
  document.querySelectorAll('#cfgFields input, #cfgFields select').forEach(el => {
    const v = el.value.trim();
    if (v && v !== '__custom__') sets.push('--set ' + encodeURIComponent(el.dataset.var) + '=' + encodeURIComponent(v));
  });
  document.getElementById('cfgOverlay').classList.remove('show');
  if (!sets.length) { await loadApps(); return; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await ancli('config ' + cfgApp.id + ' ' + sets.join(' ')); } catch (e) { /* logged */ }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
  await loadApps();
};

document.getElementById('btnRefresh').onclick = async () => { await loadStatus(); await loadApps(); };

document.getElementById('btnRepair').onclick = async () => {
  if (!confirm('运行 ancli repair（修复环境/权限并重新生成 wrapper）？')) return;
  await runBackground(ANCLI + ' repair');
  await loadStatus(); await loadApps();
};

// ---------- 软键盘检测（弹出时降级液态玻璃，避免卡顿/闪屏） ----------
function setupImeGuard() {
  const vv = window.visualViewport;
  if (!vv) {
    // Fallback: classic resize heuristic
    let lastH = window.innerHeight;
    window.addEventListener('resize', () => {
      const h = window.innerHeight;
      if (Math.abs(lastH - h) > 120) {
        document.body.classList.toggle('ime-open', h < lastH);
        lastH = h;
      }
    });
    return;
  }
  let lastH = vv.height;
  vv.addEventListener('resize', () => {
    const h = vv.height;
    // Keyboard visible when the visual viewport shrinks significantly
    const open = h < window.innerHeight * 0.72;
    document.body.classList.toggle('ime-open', open);
    // Keep dialog input visible above the keyboard
    const inp = document.activeElement;
    if (open && inp && inp.tagName === 'INPUT') {
      try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ }
    }
    lastH = h;
  });
}

// ---------- 主题：跟随系统 / 手动指定 ----------
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'auto') {
    root.removeAttribute('data-theme');
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) root.setAttribute('data-theme', 'dark');
  } else {
    root.setAttribute('data-theme', mode);
  }
  document.querySelectorAll('#themeSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.theme === mode));
  try { localStorage.setItem('ancli_theme', mode); } catch (e) { /* ignore */ }
}

document.querySelectorAll('#themeSwitch button').forEach(b => {
  b.onclick = () => applyTheme(b.dataset.theme);
});
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    const saved = localStorage.getItem('ancli_theme') || 'auto';
    if (saved === 'auto') applyTheme('auto');
  });
}

(async function init() {
  setupImeGuard();
  let saved = 'auto';
  try { saved = localStorage.getItem('ancli_theme') || 'auto'; } catch (e) { /* ignore */ }
  applyTheme(saved);
  log('AnCLI WebUI 初始化…');
  ANCLI = await findAncli();
  log('ancli 路径: ' + ANCLI);
  await loadStatus();
  await loadApps();
})();
</script>
